<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#0f121a"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2979FF"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#squircleGrad)"/>
  <!-- Vinyl Body -->
  <circle cx="256" cy="256" r="190" fill="#13151c"/>
  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#222736" stroke-width="4"/>
  <circle cx="256" cy="256" r="146" fill="none" stroke="#222736" stroke-width="4"/>
  <circle cx="256" cy="256" r="124" fill="none" stroke="#222736" stroke-width="4"/>
  <!-- Center Record Label (Glowing Cyan-Blue) -->
  <circle cx="256" cy="256" r="82" fill="url(#labelGrad)"/>
  <!-- Center Spindle Hole -->
  <circle cx="256" cy="256" r="22" fill="#0d0f14"/>
</svg>
