name: Build & Package Recall

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Release & DMG
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Swift
      run: swift --version

    - name: Build Release Bundle & DMG
      run: |
        chmod +x build.sh
        ./build.sh --dmg

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Recall-DMG
        path: build/Recall.dmg
        if-no-files-found: error
