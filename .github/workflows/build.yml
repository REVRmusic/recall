name: Build & Package Recall (macOS & Windows)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Release & DMG
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Swift
      run: swift --version

    - name: Build Release Bundle & DMG
      run: |
        chmod +x build.sh
        ./build.sh --dmg

    - name: Upload macOS DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Recall-macOS-DMG
        path: build/Recall.dmg
        if-no-files-found: error

    - name: Upload macOS ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Recall-macOS-ZIP
        path: build/Recall-macOS.zip
        if-no-files-found: error

  build-windows:
    name: Build Windows Release & Executable
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Windows/Recall.sln

    - name: Publish Self-Contained Windows Executable
      run: |
        dotnet publish Windows/Recall/Recall.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o build-win
        Compress-Archive -Path build-win/* -DestinationPath build-win/Recall-Windows-x64.zip

    - name: Upload Windows x64 Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Recall-Windows-x64-ZIP
        path: build-win/Recall-Windows-x64.zip
        if-no-files-found: error

    - name: Upload Windows Standalone EXE
      uses: actions/upload-artifact@v4
      with:
        name: Recall-Windows-EXE
        path: build-win/Recall.exe
        if-no-files-found: error

  release:
    name: Publish Official GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout release notes
      uses: actions/checkout@v4
      with:
        sparse-checkout: .github/release-notes.md
        sparse-checkout-cone-mode: false

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: List Release Assets
      run: ls -lh release-assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/Recall.dmg
          release-assets/Recall-macOS.zip
          release-assets/Recall-Windows-x64.zip
          release-assets/Recall.exe
        name: Recall ${{ github.ref_name }} — Classification des styles du set
        body_path: .github/release-notes.md
        draft: false
        prerelease: false

